worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Grafana Live(WebSocket)용. 일반 요청에는 Connection을 비운다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name zizon-tomato.cloud;

	 resolver 127.0.0.11 valid=10s;

        ssl_certificate /etc/letsencrypt/live/zizon-tomato.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zizon-tomato.cloud/privkey.pem;

        location ~* ^/api/metrics(/|$) {
            return 404;
        }

        # 운영 서버 Promtail이 보내는 로그 수신. 운영 서버 공인 IP만 허용한다.
        location = /loki/api/v1/push {
            allow 43.202.0.171;
            deny all;

            client_max_body_size 10m;

            set $loki_backend http://loki:3100;
            proxy_pass $loki_backend;
        }

        # 일반 API
        location /api/ {
            set $api_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE
        location /api/sse/ {
            set $sse_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $sse_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;

            proxy_read_timeout 1h;
        }

	# React
	root /home/ubuntu/wannabe-ketchup/dist;
	index index.html;

	gzip_static on;

	location / {
		try_files $uri $uri/ /index.html;
	}
    }

    # Grafana. 인증서는 zizon-tomato.cloud 인증서에 monitoring 서브도메인을 추가(--expand)해 함께 쓴다.
    server {
        listen 443 ssl;
        http2 on;
        server_name monitoring.zizon-tomato.cloud;

        resolver 127.0.0.11 valid=10s;

        ssl_certificate /etc/letsencrypt/live/zizon-tomato.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zizon-tomato.cloud/privkey.pem;

        location / {
            set $grafana_backend http://grafana:3000;
            proxy_pass $grafana_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name zizon-tomato.cloud monitoring.zizon-tomato.cloud;

        return 301 https://$host$request_uri;
    }
}
