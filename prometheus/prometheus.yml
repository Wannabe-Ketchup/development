global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nest
    static_configs:
      - targets: ['nest:3000']
        labels:
          env: staging

  # 운영 서버 nginx는 /api/metrics를 이 서버 IP에만 연다.
  # job 라벨을 nest로 맞춰 대시보드가 env 라벨로만 환경을 구분하게 한다.
  - job_name: nest-production
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ['wannabe-ketchup.com']
        labels:
          job: nest
          env: production

  # 운영 서버 전체 메모리·스왑·CPU·디스크(node exporter).
  # 운영 nginx가 /api/node-metrics를 이 서버 IP에만 열어 node-exporter 컨테이너로 넘긴다.
  - job_name: node-production
    scheme: https
    metrics_path: /api/node-metrics
    static_configs:
      - targets: ['wannabe-ketchup.com']
        labels:
          job: node
          env: production
