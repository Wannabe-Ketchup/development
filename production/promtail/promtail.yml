server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

# 어디까지 보냈는지 기록해 재시작 후에도 이어서 보낸다.
positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: https://zizon-tomato.cloud/loki/api/v1/push
    external_labels:
      env: production

scrape_configs:
  - job_name: nest
    static_configs:
      - targets: [localhost]
        labels:
          job: nest
          # winston-daily-rotate-file이 날짜별로 새 파일을 만든다.
          __path__: /var/log/nest/*.log
    # winston JSON 로그: {"level":"info","message":"...","timestamp":"2026-10-28 13:00:00","traceId":"..."}
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            trace_id: traceId
      # 컨테이너 TZ가 UTC라 타임존 없이 찍힌 timestamp를 UTC로 해석한다.
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
          location: UTC
      - labels:
          level:
      # traceId는 값 종류가 많아 라벨 대신 structured metadata로 둔다.
      - structured_metadata:
          trace_id:
