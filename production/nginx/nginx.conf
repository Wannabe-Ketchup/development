worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 443 ssl;
        http2 on;
        server_name wannabe-ketchup.com;

        resolver 127.0.0.11 valid=10s;

        ssl_certificate /etc/letsencrypt/live/wannabe-ketchup.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wannabe-ketchup.com/privkey.pem;

        # 메트릭은 모니터링 서버(staging) Prometheus만 수집한다. staging 서버 공인 IP만 허용한다.
        location = /api/metrics {
            allow 13.209.64.76;
            deny all;

            set $metrics_backend http://nest:3000;
            rewrite ^ /metrics break;
            proxy_pass $metrics_backend;
        }

        location ~* ^/api/metrics(/|$) {
            return 404;
        }

        # 일반 API
        location /api/ {
            set $api_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE
        location /api/sse/ {
            set $sse_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $sse_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;

            proxy_read_timeout 1h;
        }

        # React
        root /home/ubuntu/wannabe-ketchup/dist;
        index index.html;

        gzip_static on;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name wannabe-ketchup.com;

        return 301 https://$host$request_uri;
    }
}
