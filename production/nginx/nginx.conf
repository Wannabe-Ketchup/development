worker_processes auto;

# worker가 열 수 있는 파일 수. 연결도 파일로 세므로 worker_connections보다 넉넉하게 둔다.
worker_rlimit_nofile 16384;

# 빈 연결 자리가 worker_connections의 1/16 이하가 되면 nginx가 쉬는 연결을 닫는데,
# 그 경고가 warn 수준이라 기본값(error)에서는 남지 않는다.
error_log /var/log/nginx/error.log warn;

events {
    # SSE 한 명이 연결 2개(브라우저 쪽, nest 쪽)를 쓴다.
    # 인원 제한은 아래 limit_conn이 맡으므로, 여기는 거기에 닿지 않을 만큼 넉넉하게 둔다.
    # 여기를 줄여서 막으면 꽉 찼을 때 로그 없이 연결이 끊기고 메트릭 수집도 같이 실패한다.
    worker_connections 8192;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSE 동시 접속을 서버 전체 인원으로 센다(worker끼리 공유하는 카운터).
    limit_conn_zone $server_name zone=sse_total:1m;

    server {
        listen 443 ssl;
        http2 on;
        server_name wannabe-ketchup.com;

        resolver 127.0.0.11 valid=10s;

        ssl_certificate /etc/letsencrypt/live/wannabe-ketchup.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wannabe-ketchup.com/privkey.pem;

        # 메트릭은 모니터링 서버(staging) Prometheus만 수집한다. staging 서버 공인 IP만 허용한다.
        location = /api/metrics {
            allow 13.209.64.76;
            deny all;

            set $metrics_backend http://nest:3000;
            rewrite ^ /metrics break;
            proxy_pass $metrics_backend;
        }

        location ~* ^/api/metrics(/|$) {
            return 404;
        }

        # 일반 API
        location /api/ {
            set $api_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE
        location /api/sse/ {
            # 서버 메모리가 버티는 인원보다 아래에서 새 SSE 연결을 503으로 거절한다.
            # 2000은 지금 서버(t3.micro, 메모리 908Mi) 부하 테스트로 정했다. 2000명은 메모리 안에서
            # 이벤트가 많아도 버텼고, 3000명은 스왑을 쓰기 시작해 멈췄다. 서버 사양을 바꾸면 다시 잰다.
            limit_conn sse_total 2000;
            limit_conn_status 503;

            set $sse_backend http://nest:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $sse_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;

            proxy_read_timeout 1h;
        }

        # React
        root /home/ubuntu/wannabe-ketchup/dist;
        index index.html;

        gzip_static on;

        # 빌드 파일은 이름에 해시가 있어 내용이 바뀌면 이름도 바뀐다. 1년 동안 다시 묻지 않는다.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html, public 파일, 화면 주소는 쓰기 전에 매번 서버에 확인한다.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name wannabe-ketchup.com;

        return 301 https://$host$request_uri;
    }
}
