name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wannabe-ketchup/pomodoro-api:${{ github.sha }}
            ghcr.io/wannabe-ketchup/pomodoro-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Copy compose file to host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: app-compose.yml
          target: ${{ secrets.APP_DIR }}

      - name: Pull image and restart on host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd "${{ secrets.APP_DIR }}"
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            TAG=${{ github.sha }} docker compose -f app-compose.yml pull
            TAG=${{ github.sha }} docker compose -f app-compose.yml up -d --wait --wait-timeout 120
            docker image prune -af \
              --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/Wannabe-Ketchup/development"

      - name: Verify API reachable from host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.APP_DIR }}"
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "API reachable from host"
              exit 0
            fi
            echo "API not reachable from host: HTTP $code"
            docker compose -f app-compose.yml logs --tail 50 nest
            exit 1

      - name: Copy web build to host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "web-dist/*"
          target: ${{ secrets.WEB_DIR }}
          strip_components: 1
          overwrite: true
