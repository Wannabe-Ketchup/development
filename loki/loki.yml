auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 90d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# 메모리(256m)를 아끼기 위해 결과 캐시를 끄고 동시 쿼리 수를 줄인다.
query_range:
  cache_results: false

querier:
  max_concurrent: 2

analytics:
  reporting_enabled: false
